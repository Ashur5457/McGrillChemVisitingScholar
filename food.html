}
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { asc = key === th.dataset.k ? !asc : true; key = th.dataset.k; render(); });
tbody.onclick = e => { const tr = e.target.closest("tr"); if (!tr) return; const m = markers.get(tr.dataset.n); map.setView(m.getLatLng(), 17); m.openPopup(); document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" }); };
render();
</script>
</body>
